<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f2a2e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Sanatorio del Oeste: ¿sobrevivís a la gestión del cambio?" />
    <link

      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Crect width='8' height='8' fill='%23fff'/%3E%3Crect x='3' y='1' width='2' height='6' fill='%23e04848'/%3E%3Crect x='1' y='3' width='6' height='2' fill='%23e04848'/%3E%3C/svg%3E"
    />
    <title>Sanatorio del Oeste</title>
  </head>
  <body>
    <div id="game"></div>

    <button id="mute" type="button" aria-label="Silenciar sonido" title="Sonido">
      <svg class="on" viewBox="0 0 12 12" shape-rendering="crispEdges" aria-hidden="true">
        <path fill="currentColor" d="M1 4h2v4H1zM3 4h1V3h1V2h1v8H5V9H4V8H3zM8 4h1v4H8zM10 2h1v8h-1z" />
      </svg>
      <svg class="off" viewBox="0 0 12 12" shape-rendering="crispEdges" aria-hidden="true">
        <path fill="currentColor" d="M1 4h2v4H1zM3 4h1V3h1V2h1v8H5V9H4V8H3zM8 4h1v1H8zM9 5h1v1H9zM10 4h1v1h-1zM10 6h1v1h-1zM8 6h1v1H8zM9 6h1v1H9z" />
      </svg>
    </button>

    <div id="rotate" aria-live="polite">
      <div class="rotate-box">
        <div class="rotate-phone"></div>
        <p>Girá el celu</p>
        <small>El juego se juega en vertical</small>
      </div>
    </div>

    <div id="loading">Cargando…</div>

    <noscript>
      <p style="color:#fff;font-family:monospace;padding:24px">Necesitás JavaScript activado para jugar.</p>
    </noscript>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
